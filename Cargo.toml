[package]
name = "ari-cli"
version = "0.1.0"
edition = "2024"
description = "A zero-token status panel for Claude Code"
license = "MIT"
repository = "https://github.com/Izuulo/ari"

[[bin]]
name = "ari"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.0"
unicode-width = "0.2.3"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
